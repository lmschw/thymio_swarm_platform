[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-platform"
version = "0.1.0"
description = "Python platform for Thymio swarm robotics"
requires-python = ">=3.11"

dependencies = [
    "tdmclient==0.1.21",
    "numpy",
    "pyyaml>=6.0.3",
    "pandas>=3.0.3",
    "natnet",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
# Only needed on Pis with a camera attached. Install via the system package
# manager on Raspberry Pi OS instead where possible (see
# setup_scripts/add_camera_support.sh) -- picamera2 is tied to the system
# libcamera stack and isn't reliably installable as a plain pip wheel.
# camera = ["picamera2"]

# Only needed on Pis with an AZDelivery WS2812B RGB LED ring attached
# (see setup_scripts/add_led_ring_support.sh, which also enables SPI and
# adds the daemon user to the "spi" group). Installed as a normal pip
# dependency by that script; not listed as a hard dependency here since it
# only matters -- and only imports cleanly -- on a Pi. Also requires the
# apt package python3-lgpio (Blinka's board-detection dependency on a
# Pi 5/bcm2712) in a venv with --system-site-packages, same as picamera2.
# led_ring = ["adafruit-blinka", "adafruit-circuitpython-neopixel-spi"]

[tool.setuptools.packages.find]
include = ["swarm_platform*"]

[tool.uv.sources]
natnet = { git = "https://github.com/mje-nz/python_natnet.git" }
